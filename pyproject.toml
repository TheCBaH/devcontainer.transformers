[project]
name = "hf-pt2-tools"
version = "0.1.0"
description = "Offline Transformers architecture research and verified PT2 graphs"
requires-python = ">=3.13,<3.14"
dependencies = [
    "transformers==5.18.0",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "pt2-export-core",
    "huggingface-hub",
    "safetensors",
    "pyyaml",
    "jsonschema",
    "pillow",
    "numpy",
]

[project.scripts]
hf-pt2 = "hf_pt2_tools.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest", "pytest-timeout"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hf_pt2_tools"]

[tool.uv.sources]
pt2-export-core = { path = "modules/devcontainer.pytorch-image-models/modules/pt2-export-core", editable = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
