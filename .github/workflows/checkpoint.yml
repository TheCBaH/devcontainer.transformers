name: checkpoint
on:
  push:
    paths: [checkpoint-request.json, task-fixture-request.json]
  workflow_dispatch:
    inputs:
      task_fixtures:
        description: 'Generate the pinned task-fixture request as a companion release'
        type: boolean
        default: false
      subset:
        description: 'Comma-separated model IDs with upstream safetensors'
        default: 't5-small,whisper-tiny'
        type: string
      generation:
        description: 'Also export original-size generation components and TinyCLIP towers'
        type: boolean
        default: false
      static_history:
        description: 'Static decode histories for every generation model (checkpoint-backed): auto (first history and capacity) or e.g. 4,8'
        default: ''
        type: string
      release_tag:
        description: 'Release tag for the bundles (empty: checkpoint-<sha12>)'
        default: ''
        type: string
      publish:
        description: 'Upload bundles, hosted files and the publication index to the release, then verify the downloads'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checkpoint-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      subset: ${{ steps.request.outputs.subset }}
      static: ${{ steps.request.outputs.static }}
      tag: ${{ steps.request.outputs.tag }}
      publish: ${{ steps.request.outputs.publish }}
      components: ${{ steps.request.outputs.components }}
      tasks: ${{ steps.request.outputs.tasks }}
      recipes: ${{ steps.tasks.outputs.recipes }}
      fixture_tag: ${{ steps.tasks.outputs.fixture_tag }}
      fixture_publish: ${{ steps.tasks.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select task request
        id: mode
        env:
          DISPATCH_TASKS: ${{ inputs.task_fixtures }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          tasks=false
          if [ "$DISPATCH_TASKS" = true ] || { [ "$EVENT_NAME" = push ] && git diff --name-only HEAD^ HEAD | grep -qx task-fixture-request.json; }; then tasks=true; fi
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
      - name: Plan pinned task fixtures
        id: tasks
        if: steps.mode.outputs.tasks == 'true'
        run: python3 scripts/task-fixtures.py plan
      - name: Read request
        id: request
        run: |
          echo "tasks=${{ steps.mode.outputs.tasks }}" >> "$GITHUB_OUTPUT"
          # inputs on dispatch; checkpoint-request.json on push (workflow_dispatch needs the file on the default branch)
          if [ -n "${{ inputs.subset }}" ]; then
            subset='${{ inputs.subset }}'; generation='${{ inputs.generation }}'; tag='${{ inputs.release_tag }}'; publish='${{ inputs.publish }}'; static='${{ inputs.static_history }}'
          else
            subset=$(jq -r .subset checkpoint-request.json); generation=$(jq -r .generation checkpoint-request.json)
            tag=$(jq -r '.release_tag // ""' checkpoint-request.json); publish=$(jq -r '.publish // false' checkpoint-request.json)
            static=$(jq -r '.static_history // ""' checkpoint-request.json)
          fi
          tag=${tag:-checkpoint-${GITHUB_SHA::12}}
          components='[]'
          if [ "$generation" = true ]; then
            components=$(jq -cn --arg s "$subset" '[($s | split(",")[]) | select(IN("smollm2-135m","t5-small","whisper-tiny","smolvlm-256m","tinyclip"))]')
          fi
          { echo "subset=$subset"; echo "static=$static"; echo "tag=$tag"; echo "publish=$publish"; echo "components=$components"; } >> "$GITHUB_OUTPUT"
  forward:
    needs: plan
    if: needs.plan.outputs.tasks != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 345
    env:
      OUT: .build/checkpoint
      SUBSET: ${{ needs.plan.outputs.subset }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/cache/restore@v6
        id: hf-cache
        with:
          path: .hf-cache
          key: hf-ckpt-${{ runner.arch }}-${{ hashFiles('model-candidates.yaml') }}
          restore-keys: hf-ckpt-${{ runner.arch }}-
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          python-version: '3.13.12'
          enable-cache: true
      - run: make setup
      - name: Export, bind, map and bundle checkpoint-backed graphs
        run: |
          set -euo pipefail
          uv run --frozen hf-pt2 research --population reference --weights checkpoint --subset "$SUBSET" --workers 1 --timeout 1800 --output "$OUT" \
            || echo "::warning::research reported failures; see the matrix"
          mkdir -p "$OUT/maps"
          for model in ${SUBSET//,/ }; do
            if [ "$(jq -r --arg m "$model" '.models[$m].status // "missing"' "$OUT/results/checkpoint.json")" != ok ]; then
              echo "::warning::$model export did not succeed; recorded in the matrix"; continue
            fi
            id=$(jq -r --arg m "$model" '.models[$m].artifact_id' "$OUT/results/checkpoint.json")
            flat=${id//\//--}
            uv run --frozen hf-pt2 bind --subset "$model" --graph "$OUT/models/$id/models/model.json" --output "$OUT/maps/$flat.json"
            uv run --frozen hf-pt2 map --subset "$model" --binding "$OUT/maps/$flat.json" --program "$OUT/.build/$id/model.pt2" \
              --graph "$OUT/models/$id/models/model.json" --artifact "$id" \
              --release-base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" --output "$OUT/mapsv2"
          done
          uv run --frozen hf-pt2 bundle --source "$OUT" --maps "$OUT/mapsv2" --output "$OUT/bundles"
      - uses: actions/cache/save@v6
        if: always() && steps.hf-cache.outputs.cache-hit != 'true'
        with:
          path: .hf-cache
          key: hf-ckpt-${{ runner.arch }}-${{ hashFiles('model-candidates.yaml') }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: forward
          path: |
            .build/checkpoint/bundles
            .build/checkpoint/maps
            .build/checkpoint/results
            .build/checkpoint/**/*.log
          include-hidden-files: true
          if-no-files-found: error
  components:
    needs: plan
    if: needs.plan.outputs.tasks != 'true' && needs.plan.outputs.components != '[]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.components) }}
    env:
      ROOT: .build/component
      MODEL: ${{ matrix.model }}
      STATIC_HISTORY: ${{ needs.plan.outputs.static }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # restore only: the forward job downloads every model and is the sole saver, so the entry is complete
      - uses: actions/cache/restore@v6
        with:
          path: .hf-cache
          key: hf-ckpt-${{ runner.arch }}-${{ hashFiles('model-candidates.yaml') }}
          restore-keys: hf-ckpt-${{ runner.arch }}-
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          python-version: '3.13.12'
          enable-cache: true
      - run: make setup
      - name: Original-size components, bind, map and bundle
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/maps"
          if [ "$MODEL" = tinyclip ]; then
            uv run --frozen hf-pt2 encoders --population reference --weights checkpoint --subset "$MODEL" --output "$ROOT" --timeout 3600
            mapfile -t ids < <(jq -r '.components[].artifact_id' "$ROOT/results/encoders/$MODEL-reference-checkpoint.json")
          else
            extra=(); [ -n "$STATIC_HISTORY" ] && extra=(--static-history "$STATIC_HISTORY")
            uv run --frozen hf-pt2 generation --population reference --weights checkpoint --subset "$MODEL" "${extra[@]}" --output "$ROOT" --timeout 3600
            mapfile -t ids < <(jq -r '(.components[].artifact_id), ((.static_variants // {})[] | .artifact_id)' "$ROOT/results/generation/$MODEL-reference-checkpoint.json")
          fi
          for component in "${ids[@]}"; do
            flat=${component//\//--}
            uv run --frozen hf-pt2 bind --subset "$MODEL" --graph "$ROOT/models/$component/models/model.json" --output "$ROOT/maps/$flat.json"
            uv run --frozen hf-pt2 map --subset "$MODEL" --binding "$ROOT/maps/$flat.json" --program "$ROOT/.build/$component/model.pt2" \
              --graph "$ROOT/models/$component/models/model.json" --artifact "$component" \
              --release-base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" --output "$ROOT/mapsv2"
          done
          uv run --frozen hf-pt2 bundle --source "$ROOT" --maps "$ROOT/mapsv2" --output "$ROOT/bundles"
      - name: Diagnostics
        if: always()
        run: |
          for f in "$ROOT"/.build/generation/*.log "$ROOT"/.build/encoders/*.log; do [ -f "$f" ] && { echo "== $f"; tail -n 25 "$f"; }; done || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: component-${{ matrix.model }}
          path: |
            .build/component/bundles
            .build/component/maps
            .build/component/results
            .build/component/**/*.log
          include-hidden-files: true
          if-no-files-found: error
  collect:
    needs: [plan, forward, components]
    if: ${{ !cancelled() && needs.forward.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    env:
      OUT: .build/checkpoint
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          python-version: '3.13.12'
          enable-cache: true
      - run: make setup
      - uses: actions/download-artifact@v8
        with:
          pattern: '{forward,component-*}'
          path: parts
      - name: Merge parts
        run: |
          set -euo pipefail
          mkdir -p "$OUT/bundles" "$OUT/maps" "$OUT/results" "$OUT-generation/results" "$OUT-components/results"
          cp -r parts/forward/bundles/. "$OUT/bundles/"; cp -r parts/forward/maps/. "$OUT/maps/"; cp -r parts/forward/results/. "$OUT/results/"
          shopt -s nullglob
          for part in parts/component-*; do
            cp -r "$part"/bundles/. "$OUT/bundles/"; cp -r "$part"/maps/. "$OUT/maps/"
            [ -d "$part/results/generation" ] && cp -r "$part/results/generation" "$OUT-generation/results/"
            [ -d "$part/results/encoders" ] && cp -r "$part/results/encoders" "$OUT-components/results/"
          done
          true
      - name: Verify bundles offline
        run: uv run --frozen hf-pt2 bundle-verify --output "$OUT/bundles"
      - name: Checkpoint matrix
        if: always()
        run: uv run --frozen hf-pt2 matrix --source "$OUT" --output "$OUT/bundles/checkpoint-matrix.md"
      - name: Publication index
        run: uv run --frozen hf-pt2 index --output "$OUT/bundles" --release-repo "$GITHUB_REPOSITORY" --release-tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: checkpoint-bundles
          path: .build/checkpoint/bundles
          if-no-files-found: error
  publish:
    needs: [plan, components, collect]
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && needs.collect.result == 'success' && needs.components.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: checkpoint-bundles
          path: bundles
      - name: Verify and publish a new immutable release
        run: |
          python3 scripts/publish-release.py --directory bundles --repository "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$GITHUB_SHA"
      - name: Verify clean downloads against the index
        run: |
          set -euo pipefail
          mkdir -p fresh
          jq -r '.artifacts[].assets[] | [.url, .sha256, .size] | @tsv' bundles/publication.json | while IFS=$'\t' read -r url sha size; do
            curl -fsSL --retry 3 -o fresh/asset "$url"
            [ "$(sha256sum fresh/asset | cut -d' ' -f1)" = "$sha" ] && [ "$(stat -c %s fresh/asset)" = "$size" ] \
              || { echo "MISMATCH $url"; exit 1; }
            echo "ok $url"
          done
  task-generate:
    needs: plan
    if: needs.plan.outputs.tasks == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.recipes) }}
    env:
      RECIPE: ${{ matrix.recipe }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/cache/restore@v6
        with:
          path: .hf-cache
          key: hf-ckpt-${{ runner.arch }}-${{ hashFiles('model-candidates.yaml') }}
          restore-keys: hf-ckpt-${{ runner.arch }}-
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          python-version: '3.13.12'
          enable-cache: true
      - run: make setup
      - name: Generate and verify frozen producer references
        run: uv run --frozen python scripts/task-fixtures.py generate --recipe "$RECIPE"
      - uses: actions/upload-artifact@v7
        with:
          name: task-${{ matrix.recipe }}
          path: |
            .build/task-fixtures/*.tar.gz
            .build/task-fixtures/*.manifest.json
            .build/task-fixtures/*.example.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failed-task-${{ matrix.recipe }}
          path: .build/task-fixtures/.work
          include-hidden-files: true
          if-no-files-found: ignore
  task-index:
    needs: [plan, task-generate]
    runs-on: ubuntu-24.04-arm
    env:
      TAG: ${{ needs.plan.outputs.fixture_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          python-version: '3.13.12'
          enable-cache: true
      - run: make setup
      - uses: actions/download-artifact@v8
        with:
          pattern: task-*
          path: .build/task-fixtures
          merge-multiple: true
      - name: Verify complete requested case coverage and write the pinned index
        run: |
          uv run --frozen python scripts/task-fixtures.py index --repository "$GITHUB_REPOSITORY" --tag "$TAG"
          uv run --frozen python scripts/task-fixtures.py verify --index-pin .build/task-fixtures/task-fixtures.pin.json --tensors
      - uses: actions/upload-artifact@v7
        with:
          name: task-fixture-bundles
          path: .build/task-fixtures/*
          if-no-files-found: error
  task-publish:
    needs: [plan, task-index]
    if: needs.plan.outputs.fixture_publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.fixture_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: task-fixture-bundles
          path: bundles
      - name: Publish verified companion release
        run: python3 scripts/publish-release.py --directory bundles --repository "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$GITHUB_SHA" --index task-fixtures.json
      - name: Verify published downloads independently
        run: |
          mkdir -p fresh
          jq -r '.fixtures[].assets[] | [.url, .sha256, .size] | @tsv' bundles/task-fixtures.json | while IFS=$'\t' read -r url sha size; do
            curl -fsSL --retry 3 -o fresh/asset "$url"
            [ "$(sha256sum fresh/asset | cut -d' ' -f1)" = "$sha" ] && [ "$(stat -c %s fresh/asset)" = "$size" ] || exit 1
          done
