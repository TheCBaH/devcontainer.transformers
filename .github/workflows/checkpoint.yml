name: checkpoint
on:
  push:
    paths: [checkpoint-request.json]
  workflow_dispatch:
    inputs:
      subset:
        description: 'Comma-separated model IDs with upstream safetensors'
        default: 't5-small,whisper-tiny'
        type: string
      generation:
        description: 'Also export original-size generation components and TinyCLIP towers'
        type: boolean
        default: false
      static_history:
        description: 'Comma-separated SmolLM2 static decode histories to export (checkpoint-backed), e.g. 4,8'
        default: ''
        type: string
      pack_tag:
        description: 'Release tag for the derived packs (empty: checkpoint-packs-<sha12>)'
        default: ''
        type: string
      publish:
        description: 'Upload bundles, packs and the publication index to the release, then verify the downloads'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checkpoint-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    outputs:
      tag: ${{ steps.request.outputs.tag }}
      publish: ${{ steps.request.outputs.publish }}
    env:
      OUT: .build/checkpoint
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Read request
        id: request
        run: |
          # inputs on dispatch; checkpoint-request.json on push (workflow_dispatch needs the file on the default branch)
          if [ -n "${{ inputs.subset }}" ]; then
            subset='${{ inputs.subset }}'; generation='${{ inputs.generation }}'; tag='${{ inputs.pack_tag }}'; publish='${{ inputs.publish }}'; static='${{ inputs.static_history }}'
          else
            subset=$(jq -r .subset checkpoint-request.json); generation=$(jq -r .generation checkpoint-request.json)
            tag=$(jq -r '.pack_tag // ""' checkpoint-request.json); publish=$(jq -r '.publish // false' checkpoint-request.json)
            static=$(jq -r '.static_history // ""' checkpoint-request.json)
          fi
          tag=${tag:-checkpoint-packs-${GITHUB_SHA::12}}
          { echo "SUBSET=$subset"; echo "GENERATION=$generation"; echo "PACK_TAG=$tag"; echo "STATIC_HISTORY=$static"; } >> "$GITHUB_ENV"
          { echo "tag=$tag"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .hf-cache
          key: hf-${{ runner.arch }}-${{ hashFiles('checkpoint-maps/*.json') }}
          restore-keys: hf-${{ runner.arch }}-
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          python-version: '3.13.12'
          enable-cache: true
      - run: make setup
      - name: Export, bind and verify checkpoint-backed graphs
        run: |
          set -euo pipefail
          uv run --frozen hf-pt2 research --population reference --weights checkpoint --subset "$SUBSET" --workers 1 --timeout 1800 --output "$OUT"
          mkdir -p "$OUT/maps" "$OUT/packs"
          for model in ${SUBSET//,/ }; do
            id=$(jq -r --arg m "$model" '.models[$m].artifact_id' "$OUT/results/checkpoint.json")
            uv run --frozen hf-pt2 bind --subset "$model" --graph "$OUT/models/$id/models/model.json" --output "$OUT/maps/$model.json"
            uv run --frozen hf-pt2 pack --subset "$model" --binding "$OUT/maps/$model.json" --program "$OUT/.build/$id/model.pt2" \
              --graph "$OUT/models/$id/models/model.json" --artifact "$id" \
              --pack-repo "$GITHUB_REPOSITORY" --pack-revision "$GITHUB_SHA" \
              --pack-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$PACK_TAG/${id//\//--}.safetensors" \
              --output "$OUT/packs"
          done
          uv run --frozen hf-pt2 bundle --source "$OUT" --packs "$OUT/packs" --output "$OUT/bundles"
      - name: Original-size components
        if: ${{ env.GENERATION == 'true' }}
        run: |
          set -euo pipefail
          pack_components() { # model, output root, artifact IDs...
            local model=$1 root=$2; shift 2
            for component in "$@"; do
              local flat=${component//\//--}
              uv run --frozen hf-pt2 bind --subset "$model" --graph "$root/models/$component/models/model.json" --output "$OUT/maps/$flat.json"
              uv run --frozen hf-pt2 pack --subset "$model" --binding "$OUT/maps/$flat.json" \
                --program "$root/.build/$component/model.pt2" --graph "$root/models/$component/models/model.json" --artifact "$component" \
                --pack-repo "$GITHUB_REPOSITORY" --pack-revision "$GITHUB_SHA" \
                --pack-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$PACK_TAG/$flat.safetensors" \
                --output "$OUT/packs"
            done
          }
          for model in ${SUBSET//,/ }; do
            case "$model" in
              smollm2-135m|t5-small|whisper-tiny|smolvlm-256m)
                extra=(); [ "$model" = smollm2-135m ] && [ -n "$STATIC_HISTORY" ] && extra=(--static-history "$STATIC_HISTORY")
                uv run --frozen hf-pt2 generation --population reference --weights checkpoint --subset "$model" "${extra[@]}" --output "$OUT-generation" --timeout 3600
                mapfile -t ids < <(jq -r '(.components[].artifact_id), ((.static_variants // {})[] | .artifact_id)' "$OUT-generation/results/generation/$model-reference-checkpoint.json")
                pack_components "$model" "$OUT-generation" "${ids[@]}" ;;
              tinyclip)
                uv run --frozen hf-pt2 encoders --population reference --weights checkpoint --subset "$model" --output "$OUT-components" --timeout 3600
                mapfile -t ids < <(jq -r '.components[].artifact_id' "$OUT-components/results/encoders/$model-reference-checkpoint.json")
                pack_components "$model" "$OUT-components" "${ids[@]}" ;;
            esac
          done
          for root in "$OUT-generation" "$OUT-components"; do
            [ -d "$root/models" ] && uv run --frozen hf-pt2 bundle --source "$root" --packs "$OUT/packs" --output "$OUT/bundles"
          done
          true
      - name: Generation diagnostics
        if: always()
        run: |
          for f in "$OUT"-generation/.build/generation/*.log "$OUT"-components/.build/encoders/*.log; do [ -f "$f" ] && { echo "== $f"; tail -n 25 "$f"; }; done || true
      - name: Verify bundles offline
        run: uv run --frozen hf-pt2 bundle-verify --output "$OUT/bundles"
      - name: Publication index
        run: uv run --frozen hf-pt2 index --output "$OUT/bundles" --pack-repo "$GITHUB_REPOSITORY" --pack-tag "$PACK_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: checkpoint-bundles
          path: .build/checkpoint/bundles
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checkpoint-evidence
          path: |
            .build/checkpoint/results
            .build/checkpoint/maps
            .build/checkpoint/packs
            .build/checkpoint/bundles
            .build/checkpoint-generation/results
            .build/checkpoint/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
  publish:
    needs: checkpoint
    if: needs.checkpoint.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.checkpoint.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: checkpoint-bundles
          path: bundles
      - name: Upload release assets
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Derived checkpoint packs $TAG" --notes "Producer commit $GITHUB_SHA. See publication.json for digests and provenance."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" bundles/*
      - name: Verify clean downloads against the index
        run: |
          set -euo pipefail
          mkdir -p fresh
          jq -r '.artifacts[].assets[] | [.url, .sha256, .size] | @tsv' bundles/publication.json | while IFS=$'\t' read -r url sha size; do
            curl -fsSL --retry 3 -o fresh/asset "$url"
            [ "$(sha256sum fresh/asset | cut -d' ' -f1)" = "$sha" ] && [ "$(stat -c %s fresh/asset)" = "$size" ] \
              || { echo "MISMATCH $url"; exit 1; }
            echo "ok $url"
          done
