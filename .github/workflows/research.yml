name: research
on:
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Regenerate symbolic-shapes.md from saved graphs without exporting models'
        type: boolean
        default: false
      subset:
        description: 'Comma-separated reviewed model IDs; empty selects eight core references'
        default: ''
        type: string
      population:
        description: 'Random-weight config population'
        type: choice
        options: [reference, tiny]
        default: reference
permissions:
  contents: read
concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  symbolic-report:
    if: ${{ inputs.report_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: python3 -m unittest discover -s tests -p test_symbolic_report.py
      - run: make report.symbolic
      - uses: actions/upload-artifact@v7
        with:
          name: symbolic-report
          path: symbolic-shapes.md
  research:
    if: ${{ !inputs.report_only }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      PROBE_SUBSET: ${{ inputs.subset }}
      PROBE_POPULATION: ${{ inputs.population }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/cache@v6
        with:
          path: .hf-cache
          key: hf-${{ runner.arch }}-${{ hashFiles('checkpoint-maps/*.json') }}
          restore-keys: hf-${{ runner.arch }}-
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          python-version: '3.13.12'
          enable-cache: true
      - run: make setup
      - run: uv run --frozen hf-pt2 research --population "$PROBE_POPULATION" --subset "$PROBE_SUBSET" --workers 1 --timeout 900 --output .build/research
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: research-results
          path: |
            .build/research/results/
            .build/research/models/
            .build/research/.build/**/*.log
          include-hidden-files: true
