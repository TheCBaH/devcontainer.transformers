name: build
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  uv:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          python-version: '3.13.12'
          enable-cache: true
      - run: make test report.ci models.select models models.verify check-tree-clean
      - uses: actions/upload-artifact@v7.0.0
        if: failure()
        with:
          name: uv-diagnostics
          path: .build/**/*.log
          include-hidden-files: true
  devcontainer:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: TheCBaH/devcontainer-action/devcontainer@v1
        id: devcontainer
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ${{ steps.devcontainer.outputs.exec }} make test report.ci models.select models models.verify check-tree-clean
      - uses: actions/upload-artifact@v7.0.0
        if: failure()
        with:
          name: container-diagnostics
          path: .build/**/*.log
          include-hidden-files: true
  x86-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          python-version: '3.13.12'
          enable-cache: true
      - run: make smoke
